{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="auth-page">
        <div class="auth-card">
            <h1>Вход</h1>
            <form method="post">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="form-error" style="margin-bottom:16px;">{{ form.non_field_errors }}</div>
                {% endif %}
                <div class="form-row">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="form-row">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Войти</button>
            </form>
            <div class="auth-footer">
                Нет аккаунта? <a href="{% url 'ads:register' %}">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
