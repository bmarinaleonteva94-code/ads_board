{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="form-page">
        <div class="form-card">
            <h1>{{ title }}</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-row">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <div class="form-help">{{ field.help_text|safe }}</div>
                        {% endif %}
                        {% if field.errors %}
                            <div class="form-error">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <a href="{% url 'ads:my_ads' %}" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
